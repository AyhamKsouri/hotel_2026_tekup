{% extends 'base.html' %}{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card card-clean" style="max-width:680px"><div class="card-body p-4"><h1 class="h4 font-display mb-3">{{ title }}</h1>
<form method="post" novalidate>{% csrf_token %}{% include 'form_fields.html' %}
<button class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Enregistrer</button> <a class="btn btn-light" href="{{ back_url }}">Annuler</a></form></div></div>
<script>
(function(){
  var $=function(i){return document.getElementById(i);};
  // dates d'arrivée / départ : calendrier cohérent + durée calculée automatiquement
  var a=$('id_check_in'), b=$('id_check_out');
  if(a&&b){
    var box=document.createElement('div'); box.className='mb-3';
    box.innerHTML='<label class="form-label fw-semibold" for="id_duration">Durée du séjour</label><input type="text" id="id_duration" class="form-control bg-light fw-semibold" value="—" readonly tabindex="-1"><div class="form-text">Départ − arrivée, calculée automatiquement.</div>';
    b.closest('.mb-3').insertAdjacentElement('afterend',box);
    var iso=function(d){var m=d.getMonth()+1,j=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(j<10?'0':'')+j;};
    var parse=function(v){var p=v.split('-');return new Date(+p[0],+p[1]-1,+p[2]);};
    var sync=function(){
      var base=a.value?parse(a.value):new Date();
      b.min=iso(new Date(base.getFullYear(),base.getMonth(),base.getDate()+1));
      if(b.value&&a.value&&parse(b.value)<=parse(a.value))b.value='';
      var n=(a.value&&b.value)?Math.round((parse(b.value)-parse(a.value))/86400000):0;
      $('id_duration').value=n>0?n+' nuit'+(n>1?'s':''):'—';
    };
    ['input','change'].forEach(function(e){a.addEventListener(e,sync);b.addEventListener(e,sync);}); sync();
  }
  // réceptionniste : le champ « hôtel » n'apparaît que pour ce rôle
  var role=$('id_role'), hotel=$('id_hotel');
  if(role&&hotel){
    var row=hotel.closest('.mb-3');
    var toggle=function(){row.classList.toggle('d-none',role.value!=='receptionist');};
    role.addEventListener('change',toggle); toggle();
  }
})();
</script>
{% endblock %}
