<style>
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.75rem}
  .gal .it{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#eef1f6}
  .gal .it img{width:100%;height:100%;object-fit:cover}
  .gal .it form{position:absolute;top:6px;right:6px}
  .gal .add{aspect-ratio:1;border:2px dashed #b8c2d6;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:#6b7488;font-size:2.4rem;transition:.2s}
  .gal .add:hover{border-color:var(--bs-primary);color:var(--bs-primary);background:#f4f7fc}
</style>
<h3 class="h6 fw-bold"><i class="bi bi-images me-1"></i>Galerie photos de l'hôtel <small class="text-secondary fw-normal">({{ gallery|length }}/{{ max_images }})</small></h3>
<div class="gal mb-2">
  {% for g in gallery %}<div class="it"><img src="{{ g.image.url }}" alt="">
    <form method="post" action="{% url 'hotel_image_delete' hotel.pk g.pk %}">{% csrf_token %}
      <button class="btn btn-sm btn-danger py-0 px-1" title="Supprimer"><i class="bi bi-x-lg"></i></button></form></div>{% endfor %}
  {% if gallery|length < max_images %}<label class="add" for="galleryInput" title="Ajouter des images">+</label>{% endif %}
</div>
<form method="post" action="{% url 'hotel_image_add' hotel.pk %}" enctype="multipart/form-data" id="galleryForm">{% csrf_token %}
  <input type="file" name="images" id="galleryInput" accept="image/*" multiple class="d-none" form="galleryForm"
         onchange="if(this.files.length)this.form.submit()"></form>
<div class="form-text mb-3">Cliquez sur « + » pour ajouter une ou plusieurs photos (5 Mo max chacune).</div>
