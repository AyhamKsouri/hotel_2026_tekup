{% if r.invoice %}{% if r.invoice.status == 'paid' %}<span class="badge text-bg-success">Payée · {{ r.invoice.amount|floatformat:2 }} TND</span>{% else %}<span class="badge text-bg-warning">À encaisser · {{ r.invoice.amount|floatformat:2 }} TND</span> <a class="small" href="{% url 'invoice_pay' r.invoice.pk %}?next={{ request.path|urlencode }}">Encaisser</a>{% endif %}{% else %}<span class="badge text-bg-light border">Pas de facture</span>{% endif %}
